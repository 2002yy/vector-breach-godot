name: Step16 C4 Bootstrap

on:
  push:
    branches: [feature/step16-c4-device]
    paths:
      - .github/workflows/step16-c4-bootstrap.yml
      - tools/blender/build_c4_device.py

permissions:
  contents: write

jobs:
  bootstrap-c4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Blender 5.2.1 LTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 git-lfs
          mkdir -p .tools/blender
          curl --fail --location --retry 3 \
            --output /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C .tools/blender --strip-components=1
          .tools/blender/blender --version
          git lfs install --local

      - name: Build real C4 canonical source and runtime GLB
        shell: bash
        run: |
          set -euo pipefail
          .tools/blender/blender \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tools/blender/build_c4_device.py

          test -s assets-source/blender/objectives/c4_device_source.blend
          test -s assets/models/objectives/c4_device.glb
          python - <<'PY'
          from pathlib import Path
          source = Path('assets-source/blender/objectives/c4_device_source.blend')
          runtime = Path('assets/models/objectives/c4_device.glb')
          source_head = source.read_bytes()[:4]
          runtime_head = runtime.read_bytes()[:4]
          if source_head != b'BLEN' and source.read_bytes()[:4] != bytes.fromhex('28b52ffd'):
              raise SystemExit(f'canonical source is not a real Blender/Zstd binary: {source_head!r}')
          if runtime_head != b'glTF':
              raise SystemExit(f'runtime asset is not GLB: {runtime_head!r}')
          print(f'C4_SOURCE_BYTES={source.stat().st_size}')
          print(f'C4_RUNTIME_BYTES={runtime.stat().st_size}')
          PY

      - name: Measure fresh C4 GLB baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          path = Path('assets/models/objectives/c4_device.glb')
          data = path.read_bytes()
          magic, version, declared = struct.unpack_from('<4sII', data, 0)
          if magic != b'glTF' or version != 2 or declared != len(data):
              raise SystemExit('invalid C4 GLB header')
          offset = 12
          length, chunk_type = struct.unpack_from('<II', data, offset)
          offset += 8
          if chunk_type != 0x4E4F534A:
              raise SystemExit('C4 GLB has no leading JSON chunk')
          gltf = json.loads(data[offset:offset + length].rstrip(b' \t\r\n\0').decode('utf-8'))
          accessors = gltf.get('accessors', [])
          triangles = 0
          primitives = 0
          vertices_by_primitive = 0
          for mesh in gltf.get('meshes', []):
              for primitive in mesh.get('primitives', []):
                  primitives += 1
                  attrs = primitive.get('attributes', {})
                  pos_index = attrs.get('POSITION')
                  if isinstance(pos_index, int) and 0 <= pos_index < len(accessors):
                      vertices_by_primitive += int(accessors[pos_index].get('count', 0))
                  element_accessor = primitive.get('indices', pos_index)
                  count = 0
                  if isinstance(element_accessor, int) and 0 <= element_accessor < len(accessors):
                      count = int(accessors[element_accessor].get('count', 0))
                  mode = int(primitive.get('mode', 4))
                  if mode == 4:
                      triangles += count // 3
                  elif mode in (5, 6):
                      triangles += max(0, count - 2)
          metrics = {
              'file_size_bytes': len(data),
              'nodes': len(gltf.get('nodes', [])),
              'meshes': len(gltf.get('meshes', [])),
              'primitives': primitives,
              'vertices_by_primitive': vertices_by_primitive,
              'triangles': triangles,
              'materials': len(gltf.get('materials', [])),
              'textures': len(gltf.get('textures', [])),
              'images': len(gltf.get('images', [])),
              'skins': len(gltf.get('skins', [])),
              'skin_joints_total': sum(len(skin.get('joints', [])) for skin in gltf.get('skins', [])),
              'animations': len(gltf.get('animations', [])),
              'animation_channels': sum(len(animation.get('channels', [])) for animation in gltf.get('animations', [])),
              'extensions_used': gltf.get('extensionsUsed', []),
          }
          Path('reports/c4-bootstrap-baseline.json').write_text(json.dumps(metrics, indent=2) + '\n', encoding='utf-8')
          print('C4_BASELINE=' + json.dumps(metrics, sort_keys=True))
          PY

      - name: Commit real canonical source and runtime asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets-source/blender/objectives/c4_device_source.blend \
            assets/models/objectives/c4_device.glb
          git lfs status
          if git diff --cached --quiet; then
            echo 'C4 bootstrap produced no tracked changes.'
            exit 0
          fi
          git commit -m 'art: bootstrap C4 canonical source and runtime'
          git push origin HEAD:feature/step16-c4-device

      - name: Upload C4 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step16-c4-bootstrap-baseline
          path: reports/c4-bootstrap-baseline.json
          if-no-files-found: warn
          retention-days: 14
