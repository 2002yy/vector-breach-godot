name: Windows Export

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "export_presets.cfg"
      - ".github/workflows/windows-export.yml"
      - "project.godot"
  push:
    tags:
      - "v*"

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Windows build
        id: export
        continue-on-error: true
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop
          relative_export_path: build
          archive_output: true
          archive_root_folder: true
          cache: false
          verbose: true

      - name: Isolate export wrapper failure
        if: steps.export.outcome == 'failure'
        shell: bash
        run: |
          set +e
          DIAG_DIR="$RUNNER_TEMP/export-diagnostics"
          ACTION_DIR="$RUNNER_TEMP/action-style-export"
          PATH_DIR="$RUNNER_TEMP/path-style-export"
          mkdir -p "$DIAG_DIR" "$ACTION_DIR" "$PATH_DIR"

          GODOT_BIN="$(find "$HOME/.local/share/godot/godot_executable" -type f -name '*.x86_64' -print -quit)"

          {
            echo "GODOT_BIN=$GODOT_BIN"
            echo "=== Godot version ==="
            "$GODOT_BIN" --version
            echo "=== Wrapper output candidates after action failure ==="
            for dir in \
              "$HOME/.local/share/godot/builds" \
              "$HOME/.local/share/godot/archives" \
              "$GITHUB_WORKSPACE/build"; do
              echo "--- $dir"
              if [ -e "$dir" ]; then
                find "$dir" -maxdepth 4 -type f -printf '%p %s bytes\n' | sort
              else
                echo "MISSING"
              fi
            done
          } > "$DIAG_DIR/environment-and-wrapper-files.txt" 2>&1

          echo "=== Action-style positional project invocation ===" > "$DIAG_DIR/action-style.log"
          "$GODOT_BIN" "$GITHUB_WORKSPACE/project.godot" --headless \
            --export-release "Windows Desktop" "$ACTION_DIR/VectorBreach.exe" --verbose \
            >> "$DIAG_DIR/action-style.log" 2>&1
          ACTION_EXIT=$?
          echo "$ACTION_EXIT" > "$DIAG_DIR/action-style-exit-code.txt"
          find "$ACTION_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort \
            > "$DIAG_DIR/action-style-files.txt"

          if [ "$ACTION_EXIT" -ne 0 ]; then
            echo "=== Known-good --path invocation ===" > "$DIAG_DIR/path-style.log"
            "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --headless --verbose \
              --export-release "Windows Desktop" "$PATH_DIR/VectorBreach.exe" \
              >> "$DIAG_DIR/path-style.log" 2>&1
            PATH_EXIT=$?
            echo "$PATH_EXIT" > "$DIAG_DIR/path-style-exit-code.txt"
            find "$PATH_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort \
              > "$DIAG_DIR/path-style-files.txt"
          else
            echo "SKIPPED_ACTION_STYLE_SUCCEEDED" > "$DIAG_DIR/path-style-exit-code.txt"
          fi

          # Keep diagnostics small: preserve manifests/logs, not 100MB+ binaries.
          rm -f "$ACTION_DIR"/* "$PATH_DIR"/*

          cat "$DIAG_DIR/environment-and-wrapper-files.txt"
          echo "ACTION_STYLE_EXIT=$ACTION_EXIT"
          cat "$DIAG_DIR/action-style-files.txt"
          if [ -f "$DIAG_DIR/path-style-files.txt" ]; then
            echo "PATH_STYLE_EXIT=$(cat "$DIAG_DIR/path-style-exit-code.txt")"
            cat "$DIAG_DIR/path-style-files.txt"
          fi
          exit 0

      - name: Upload export diagnostics
        if: steps.export.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-diagnostics
          path: ${{ runner.temp }}/export-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Fail after diagnostics
        if: steps.export.outcome == 'failure'
        run: exit 1

      - name: Generate SHA256 manifest
        if: steps.export.outcome == 'success'
        env:
          ARCHIVE_DIR: ${{ steps.export.outputs.archive_directory }}
        run: |
          find "$ARCHIVE_DIR" -maxdepth 1 -type f -name '*.zip' -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$ARCHIVE_DIR/SHA256SUMS.txt"
          cat "$ARCHIVE_DIR/SHA256SUMS.txt"

      - name: Upload Windows build
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vector-breach-windows
          path: ${{ steps.export.outputs.archive_directory }}
          if-no-files-found: error
          retention-days: 7
