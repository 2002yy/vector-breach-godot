name: Windows Export

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "export_presets.cfg"
      - ".github/workflows/windows-export.yml"
      - "project.godot"
  push:
    tags:
      - "v*"

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Windows build
        id: export
        continue-on-error: true
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop
          archive_output: false
          cache: false
          verbose: true

      - name: Capture export failure diagnostics
        if: steps.export.outcome == 'failure'
        shell: bash
        run: |
          set +e
          DIAG_DIR="$RUNNER_TEMP/export-diagnostics"
          mkdir -p "$DIAG_DIR"
          GODOT_BIN="$(find "$HOME/.local/share/godot/godot_executable" -type f -name '*.x86_64' -print -quit)"
          {
            echo "GODOT_BIN=$GODOT_BIN"
            "$GODOT_BIN" --version
            echo "=== Build directory ==="
            find "$HOME/.local/share/godot/builds" -maxdepth 4 -type f -printf '%p %s bytes\n' | sort
          } > "$DIAG_DIR/environment.txt" 2>&1
          exit 0

      - name: Upload export diagnostics
        if: steps.export.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-diagnostics
          path: ${{ runner.temp }}/export-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Fail if Godot export failed
        if: steps.export.outcome == 'failure'
        run: exit 1

      - name: Verify exported files
        if: steps.export.outcome == 'success'
        env:
          BUILD_ROOT: ${{ steps.export.outputs.build_directory }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$BUILD_ROOT/Windows Desktop"
          test -s "$BUILD_DIR/VectorBreach.exe"
          test -s "$BUILD_DIR/VectorBreach.pck"
          find "$BUILD_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Archive Windows build and generate SHA256
        if: steps.export.outcome == 'success'
        env:
          BUILD_ROOT: ${{ steps.export.outputs.build_directory }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/windows-package"
          mkdir -p "$PACKAGE_DIR"
          cd "$BUILD_ROOT"
          zip -q -r "$PACKAGE_DIR/VectorBreach-Windows.zip" "Windows Desktop"
          cd "$PACKAGE_DIR"
          sha256sum VectorBreach-Windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh VectorBreach-Windows.zip SHA256SUMS.txt

      - name: Upload Windows build
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vector-breach-windows
          path: ${{ runner.temp }}/windows-package
          if-no-files-found: error
          retention-days: 7
