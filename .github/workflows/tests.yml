name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feature/**", "audit/**"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_VERSION: 5.2.1
      BLENDER_DIR: .tools/blender
      GODOT_RELEASE: 4.7.1-stable
      GODOT_DIR: .tools/godot
      GODOT_BIN: .tools/godot/Godot_v4.7.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Detect Blender validation surface
        id: surface
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          blender=false

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            blender=true
          else
            while IFS= read -r path; do
              case "$path" in
                .gitattributes|assets/*|assets-source/*|data/*|tools/blender/*|tools/tests/test_official_cs_mesh_transform.py|tools/check_asset_layers.py|tools/check_asset_metadata.py|tools/check_runtime_asset_contracts.py|tools/validate_runtime_assets.py|.github/workflows/tests.yml)
                  blender=true
                  break
                  ;;
              esac
            done < <(git diff --no-renames --name-only "${PR_BASE_SHA}"...HEAD)
          fi

          echo "blender=${blender}" >> "${GITHUB_OUTPUT}"
          echo "Blender validation required: ${blender}"

      - name: Asset layer policy
        run: python tools/check_asset_layers.py

      - name: Asset metadata policy
        run: python tools/check_asset_metadata.py

      - name: Asset runtime contract policy
        run: python tools/check_runtime_asset_contracts.py

      - name: Restore Godot cache
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GODOT_DIR}"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "${GODOT_DIR}"

      - name: Verify Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Install Blender runtime dependency
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Restore Blender cache
        if: steps.surface.outputs.blender == 'true'
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .tools/blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}

      - name: Install Blender
        if: steps.surface.outputs.blender == 'true' && steps.cache-blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BLENDER_DIR}"
          curl --fail --location --retry 3 \
            --output /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C "${BLENDER_DIR}" --strip-components=1

      - name: Verify Blender
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${BLENDER_DIR}/blender"
          "${BLENDER_DIR}/blender" --version

      - name: Blender source validation
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: bash ./tools/blender/run_asset_validation.sh "./${BLENDER_DIR}/blender"

      - name: Blender publish rebuild validation
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python tools/blender/run_publish_rebuild_validation.py \
              "./${BLENDER_DIR}/blender" \
              --changed-from "${PR_BASE_SHA}"
          else
            python tools/blender/run_publish_rebuild_validation.py "./${BLENDER_DIR}/blender"
          fi

      - name: Official model morph transform regression
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: |
          "./${BLENDER_DIR}/blender" --background --python-exit-code 1 --python tools/tests/test_official_cs_mesh_transform.py

      - name: Asset runtime validation
        run: python tools/validate_runtime_assets.py

      - name: Import project resources
        run: |
          "./${GODOT_BIN}" --headless --path . --import

      - name: Movement qualification gate regressions
        run: python -X utf8 -m unittest discover -s tools/tests -p 'test_m*.py' -v

      - name: Native keyboard and mouse input regressions
        shell: bash
        run: |
          set -euo pipefail
          for hz in 60 120; do
            probe_log="$(mktemp)"
            "./${GODOT_BIN}" --headless --path . --fixed-fps "$hz" --quit-after 480 \
              -s tools/authoring/test_native_route_input.gd -- "$hz" >"${probe_log}" 2>&1
            cat "${probe_log}"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "${probe_log}" || \
               ! grep -q "NATIVE_ROUTE_INPUT_OK rate=$hz" "${probe_log}"; then
              exit 1
            fi
          done

      - name: Queued input cadence boundaries
        shell: bash
        run: |
          set -euo pipefail
          for spec in '60 60' '120 120' '30 60' '120 60' '60 120'; do
            read -r process_hz physics_hz <<< "$spec"
            probe_log="$(mktemp)"
            receipt="$(mktemp)"
            "./${GODOT_BIN}" --headless --path . --fixed-fps "$process_hz" --quit-after 1200 \
              -s tools/authoring/test_queued_cadence.gd -- "$physics_hz" "$process_hz" "$receipt" >"${probe_log}" 2>&1
            cat "${probe_log}"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "${probe_log}" || \
               ! grep -q 'QUEUED_CADENCE_OBSERVATION_OK' "${probe_log}"; then
              exit 1
            fi
          done

      - name: Body corridor counterexamples
        shell: bash
        run: |
          set -euo pipefail
          probe_log="$(mktemp)"
          "./${GODOT_BIN}" --headless --path . --fixed-fps 60 --quit-after 120 \
            -s tools/authoring/test_jump_corridor.gd >"${probe_log}" 2>&1
          cat "${probe_log}"
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' "${probe_log}" || \
             ! grep -q 'JUMP_CORRIDOR_REGRESSIONS_OK' "${probe_log}"; then
            exit 1
          fi

      - name: GdUnit4 CLI tests
        run: >
          "./${GODOT_BIN}" --headless --path .
          -s -d res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a test
          --ignoreHeadlessMode

      - name: Native test suites
        run: bash ./tools/run_godot_tests.sh "./${GODOT_BIN}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
