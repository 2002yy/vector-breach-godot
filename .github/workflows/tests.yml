name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_VERSION: 5.2.1
      BLENDER_DIR: .tools/blender
      GODOT_RELEASE: 4.7.1-stable
      GODOT_DIR: .tools/godot
      GODOT_BIN: .tools/godot/Godot_v4.7.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Detect Blender validation surface
        id: surface
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          blender=false

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            blender=true
          else
            while IFS= read -r path; do
              case "$path" in
                .gitattributes|assets/*|assets-source/*|data/*|tools/blender/*|tools/check_asset_layers.py|tools/check_asset_metadata.py|tools/check_runtime_asset_contracts.py|tools/validate_runtime_assets.py|.github/workflows/tests.yml)
                  blender=true
                  break
                  ;;
              esac
            done < <(git diff --no-renames --name-only "${PR_BASE_SHA}"...HEAD)
          fi

          echo "blender=${blender}" >> "${GITHUB_OUTPUT}"
          echo "Blender validation required: ${blender}"

      - name: Asset layer policy
        run: python tools/check_asset_layers.py

      - name: Asset metadata policy
        run: python tools/check_asset_metadata.py

      - name: Asset runtime contract policy
        run: python tools/check_runtime_asset_contracts.py

      - name: Restore Godot cache
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GODOT_DIR}"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "${GODOT_DIR}"

      - name: Verify Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Install Blender runtime dependency
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Restore Blender cache
        if: steps.surface.outputs.blender == 'true'
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .tools/blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}

      - name: Install Blender
        if: steps.surface.outputs.blender == 'true' && steps.cache-blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BLENDER_DIR}"
          curl --fail --location --retry 3 \
            --output /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C "${BLENDER_DIR}" --strip-components=1

      - name: Verify Blender
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${BLENDER_DIR}/blender"
          "${BLENDER_DIR}/blender" --version

      - name: Blender source validation
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        run: bash ./tools/blender/run_asset_validation.sh "./${BLENDER_DIR}/blender"

      - name: Blender publish rebuild validation
        if: steps.surface.outputs.blender == 'true'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python tools/blender/run_publish_rebuild_validation.py \
              "./${BLENDER_DIR}/blender" \
              --changed-from "${PR_BASE_SHA}"
          else
            python tools/blender/run_publish_rebuild_validation.py "./${BLENDER_DIR}/blender"
          fi

      - name: Asset runtime validation
        run: python tools/validate_runtime_assets.py

      - name: Import project resources
        run: |
          "./${GODOT_BIN}" --headless --path . --import

      - name: GdUnit4 CLI tests
        run: >
          "./${GODOT_BIN}" --headless --path .
          -s -d res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a test
          --ignoreHeadlessMode

      - name: Native test suites
        run: bash ./tools/run_godot_tests.sh "./${GODOT_BIN}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
